<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Winner Letter • Celebrate!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ffffff;
        --ink: #111827;
        --white: #fff;
        --shadow: 0 10px 30px rgba(0,0,0,0.12);
        --radius: 20px;
        --xseed-red: #bc2026;
        --red1: #bc2026;
        --red2: #a31c22;
        --red3: #7f141a;
        --cream: #fffaf5;
        --ring: #fffdf7;
        --gold: #d4b48a;
        --gold-deep: #a7865c;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: Inter, system-ui;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      /* Envelope card */
      .postal {
        width: min(720px, 90vw);
        border-radius: var(--radius);
        background: linear-gradient(135deg,var(--red1),var(--red2),var(--red3));
        box-shadow: var(--shadow);
        padding: 18px;
        cursor: pointer;
        position: relative;
        perspective: 1000px;
        overflow: hidden;
        outline: none;
        transition: transform 0.2s ease;
        border: 1px solid rgba(0,0,0,0.12);
      }
      .postal:hover { transform: translateY(-2px); }

      .envelope-body {
        position: relative;
        height: 340px;
        border-radius: 14px;
        background: var(--red1);
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.15);
        overflow: hidden;
      }
      .flap {
        position: absolute; inset: 0 auto auto 0;
        width: 100%; height: 64%;
        background: var(--red2);
        clip-path: polygon(0 0,100% 0,50% 72%);
        transform-origin: top center;
        transition: transform 0.6s ease;
        z-index: 3;
        box-shadow: inset 0 -8px 22px rgba(0,0,0,0.2);
      }
      .postal.open .flap { transform: rotateX(180deg); }

      .letter {
        position: absolute;
        left: 12px; right: 12px; bottom: 12px; top: 28%;
        background: var(--red1);
        border-radius: 12px;
        box-shadow: 0 8px 22px rgba(0,0,0,0.18);
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; color: var(--cream);
        transform: translateY(42%);
        transition:
          background-color 0.25s ease,
          color 0.25s ease,
          transform 0.6s 0.2s ease;
      }
      /* turn cream BEFORE sliding out */
      .postal.preopen .letter {
        background: var(--cream);
        color: var(--ink);
        box-shadow: 0 10px 28px rgba(0,0,0,0.18);
      }
      .postal.open .letter { transform: translateY(-8%); }

      /* Overlay/panel */
      .overlay {
        position: fixed; inset: 0;
        background: rgba(17,24,39,0.45);
        display: none; align-items: center; justify-content: center;
        padding: 18px;
      }
      .overlay.active { display: flex; }

      .panel {
        width: min(820px,92vw);
        background: var(--cream);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 40px;
        text-align: center;
        animation: fadeIn 0.6s ease forwards;
        border: 6px double var(--gold);
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      h1.congrats {
        font-family: "Great Vibes", cursive;
        font-size: clamp(44px,7vw,86px);
        font-weight: 400;
        color: var(--xseed-red);
        margin-bottom: 20px;
        letter-spacing: 0.02em;
      }

      /* Photo shell allows badge to sit OUTSIDE without clipping */
      .photo-shell {
        position: relative;
        width: 260px;
        margin: 0 auto 28px;
        overflow: visible; /* badge can spill out */
      }

      .photo-wrap {
        width: 240px; height: 240px;
        margin: 0 auto;
        position: relative;
        border-radius: 50%;
        overflow: hidden; /* keep face within circle */
        box-shadow: 0 10px 24px rgba(0,0,0,0.12);
        border: 6px solid var(--gold);
        background: #eee;
      }
      img.hero-photo {
        width: 100%; height: 100%;
        object-fit: cover; display: block;
      }

      /* Award badge (trophy) – outside bottom-right so it never hides the face */
      .award-badge {
        position: absolute;
        bottom: -6px;       /* slightly outside the ring */
        right: -6px;
        width: 88px; height: 88px;
        border-radius: 50%;
        background: radial-gradient(120% 120% at 30% 30%, var(--gold) 0%, var(--gold-deep) 70%);
        box-shadow: 0 8px 18px rgba(0,0,0,0.22), inset 0 2px 6px rgba(255,255,255,0.35);
        display: grid; place-items: center;
        border: 6px solid var(--ring);
        transform: translate(10px, 10px) scale(0.9);
        opacity: 0;
      }
      /* Nice bounce-in when overlay appears */
      .overlay.active .award-badge {
        animation: badgeIn 650ms cubic-bezier(.2, .9, .2, 1.2) 100ms forwards;
      }
      @keyframes badgeIn {
        0% { transform: translate(10px, 10px) scale(0.6); opacity: 0; }
        70% { transform: translate(10px, 10px) scale(1.05); opacity: 1; }
        100% { transform: translate(10px, 10px) scale(1); opacity: 1; }
      }

      .trophy {
        width: 56px; height: 56px;
        filter: drop-shadow(0 2px 5px rgba(0,0,0,0.22));
      }

      h2.name { font-size: clamp(30px,4vw,48px); font-weight: 800; margin-bottom: 10px; }
      p.subtitle { font-size: clamp(18px,2.5vw,24px); color: var(--xseed-red); font-weight: 600; }

      #confetti-canvas {
        position: fixed; inset: 0;
        width: 100vw; height: 100vh;
        pointer-events: none; z-index: 50;
      }

      /* Small screens – tuck badge a bit closer */
      @media (max-width: 520px) {
        .photo-shell { width: 230px; }
        .photo-wrap { width: 210px; height: 210px; }
        .award-badge { width: 74px; height: 74px; }
        .trophy { width: 48px; height: 48px; }
      }
    </style>
  </head>
  <body>
    <canvas id="confetti-canvas"></canvas>

    <button class="postal" id="openPanel" aria-label="Open winner letter">
      <div class="envelope-body">
        <div class="flap"></div>
        <div class="letter">Tap to open the letter</div>
      </div>
    </button>

    <div class="overlay" id="overlay">
      <div class="panel">
        <img src="XSEED_Logo.png" alt="XSEED Logo"
             style="height:160px; margin-bottom:10px" />
        <h1 class="congrats">Congratulations!</h1>

        <!-- Photo circle + OUTSIDE award badge -->
        <div class="photo-shell">
          <div class="photo-wrap">
            <img src="https://picsum.photos/400" alt="Winner" class="hero-photo" />
          </div>

          <!-- Badge sits outside bottom-right so it never covers the face -->
          <div class="award-badge" aria-label="Award badge">
            <svg class="trophy" viewBox="0 0 64 64" aria-hidden="true">
              <defs>
                <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#fff3c4"/>
                  <stop offset="1" stop-color="#e0bb7f"/>
                </linearGradient>
              </defs>
              <path fill="url(#g)" d="M52 8h-6V6a2 2 0 0 0-2-2H20a2 2 0 0 0-2 2v2h-6a2 2 0 0 0-2 2v4c0 7.4 5.2 13.6 12.2 15.2A14 14 0 0 0 30 39.7V46h-6a2 2 0 0 0-2 2v6h20v-6a2 2 0 0 0-2-2h-6v-6.3a14 14 0 0 0 7.8-10.5C46.8 27.6 52 21.4 52 14V10a2 2 0 0 0-2-2ZM12 16v-4h4v6.4A10 10 0 0 1 12 16Zm40-4v4a10 10 0 0 1-4 6.4V12h4Z"/>
            </svg>
          </div>
        </div>

        <h2 class="name">Nick Edwards</h2>
        <p class="subtitle">Nagaland’s Best Student Speaker</p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script>
      const openBtn = document.getElementById("openPanel");
      const overlay = document.getElementById("overlay");
      const canvas = document.getElementById("confetti-canvas");
      const letter = openBtn.querySelector(".letter");

      function fitCanvas() {
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        canvas.width = innerWidth * dpr;
        canvas.height = innerHeight * dpr;
      }
      fitCanvas();
      window.addEventListener("resize", fitCanvas);

      const myConfetti = confetti.create(canvas, { resize: false, useWorker: false });

      function startConfettiRain() {
        (function frame() {
          myConfetti({
            particleCount: 3,
            startVelocity: 45,
            ticks: 260,
            spread: 80,
            origin: { x: Math.random(), y: -0.1 },
            scalar: 1,
          });
          requestAnimationFrame(frame);
        })();
      }

      function burst() {
        myConfetti({
          particleCount: 200,
          spread: 120,
          startVelocity: 60,
          origin: { y: 0.6 },
        });
      }

      // Two-step open: hide text -> cream -> flap -> overlay + confetti
      openBtn.addEventListener("click", () => {
        if (openBtn.classList.contains("open")) return;

        // Step 0: hide "Tap to open the letter" text
        letter.textContent = "";

        // Step 1: turn the inner card cream
        openBtn.classList.add("preopen");

        // Step 2: open flap then show overlay + confetti
        setTimeout(() => {
          openBtn.classList.add("open");
          setTimeout(() => {
            overlay.classList.add("active");
            burst();
            startConfettiRain();
          }, 650);
        }, 180);
      });
    </script>
  </body>
</html>
