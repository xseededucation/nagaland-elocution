<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Winner Letter • Celebrate!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#ffffff; 
      --ink:#111827;
      --white:#fff;
      --shadow: 0 10px 30px rgba(0,0,0,.12);
      --radius: 20px;
      --xseed-red:#BC2026;
      --red1:#BC2026; --red2:#a31c22; --red3:#7f141a;
      --cream:#fffaf5;
      --gold:#d4b48a;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px;}

    .postal{width:min(720px,90vw);border-radius:var(--radius);background:linear-gradient(135deg,var(--red1),var(--red2),var(--red3));box-shadow:var(--shadow);padding:18px;cursor:pointer;position:relative;perspective:1000px;overflow:hidden;outline:none;transition:transform .2s ease}
    .postal:hover{transform:translateY(-2px)}
    .envelope-body{position:relative;height:340px;border-radius:14px;background:var(--red1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);overflow:hidden;}
    .flap{position:absolute;inset:0 auto auto 0;width:100%;height:64%;background:var(--red2);clip-path:polygon(0 0,100% 0,50% 72%);transform-origin:top center;transition:transform .6s ease;z-index:3;box-shadow:inset 0 -8px 22px rgba(0,0,0,.2)}
    .postal.open .flap{transform:rotateX(180deg)}
    .letter{position:absolute;left:12px;right:12px;bottom:12px;top:28%;background:var(--cream);border-radius:12px;box-shadow:0 8px 22px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--xseed-red);transform:translateY(42%);transition:transform .6s .2s ease;}
    .postal.open .letter{transform:translateY(-8%)}

    .overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;padding:18px;}
    .overlay.active{display:flex}

    .panel{width:min(820px,92vw);background:var(--cream);border-radius:24px;box-shadow:var(--shadow);padding:40px;text-align:center;animation:fadeIn .6s ease forwards;border:6px double var(--gold);}
    @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    h1.congrats{font-family:'Great Vibes',cursive;font-size:clamp(44px,7vw,86px);font-weight:400;color:var(--xseed-red);margin-bottom:20px;letter-spacing:.02em;}
    img.hero-photo{width:240px;height:240px;border-radius:50%;object-fit:cover;box-shadow:0 10px 24px rgba(0,0,0,.12);border:6px solid var(--gold);margin-bottom:20px;}
    h2.name{font-size:clamp(30px,4vw,48px);font-weight:800;margin-bottom:10px;}
    p.subtitle{font-size:clamp(18px,2.5vw,24px);color:var(--xseed-red);font-weight:600;}

    #confetti-canvas{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50;}
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <button class="postal" id="openPanel">
    <div class="envelope-body">
      <div class="flap"></div>
      <div class="letter">Tap to open the letter</div>
    </div>
  </button>

  <div class="overlay" id="overlay">
    <div class="panel">
      <img src="XSEED_Logo.png" alt="XSEED Logo" style="height:160px;margin-bottom:10px;">
      <h1 class="congrats">Congratulations</h1>
      <img src="https://picsum.photos/400" alt="Magesh" class="hero-photo">
      <h2 class="name">XSEED</h2>
      <p class="subtitle">Winner of Nagaland Elocution</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script>
    const openBtn = document.getElementById('openPanel');
    const overlay = document.getElementById('overlay');
    const canvas = document.getElementById('confetti-canvas');

    function fitCanvas(){
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
    }
    fitCanvas();
    window.addEventListener('resize', fitCanvas);

    const myConfetti = confetti.create(canvas,{resize:false,useWorker:false});

    function startConfettiRain(){
      (function frame(){
        myConfetti({particleCount:3,startVelocity:45,ticks:260,spread:80,origin:{x:Math.random(),y:-0.1},scalar:1});
        requestAnimationFrame(frame);
      })();
    }

    function burst(){
      myConfetti({particleCount:200,spread:120,startVelocity:60,origin:{y:0.6}});
    }

    openBtn.addEventListener('click',()=>{
      openBtn.classList.add('open');
      setTimeout(()=>{
        overlay.classList.add('active');
        burst();
        startConfettiRain();
      },650);
    });
  </script>
</body>
</html>
